name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and Publish Instant OTA Bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/aistudio || true
          npm install --legacy-peer-deps
          VITE_NATIVE_ANDROID="true" \
          VITE_GITHUB_REPO="${GITHUB_REPOSITORY}" \
          VITE_APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          VITE_APP_COMMIT_SHA="${GITHUB_SHA:0:7}" \
          npm run build

          cat > dist/sw.js << 'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                .then(() => self.registration.unregister())
            );
          });
          EOF

          OTA_WORK="${RUNNER_TEMP}/ota_publish"
          rm -rf "$OTA_WORK"
          mkdir -p "$OTA_WORK"

          (
            cd dist
            zip -qr "${OTA_WORK}/ota-bundle.zip" .
          )

          node -e '
            const fs = require("fs");
            const manifest = {
              repo: process.env.GITHUB_REPOSITORY || "",
              runNumber: parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10) || 1,
              commit: (process.env.GITHUB_SHA || "").slice(0, 7),
              fullCommit: process.env.GITHUB_SHA || "",
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync(process.argv[1], JSON.stringify(manifest, null, 2));
          ' "${OTA_WORK}/ota-manifest.json"

          (
            cd "$OTA_WORK"
            git init -q
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -q -b ota-live
            git add ota-manifest.json ota-bundle.zip
            git commit -q -m "OTA update build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ota-live
          )
        env:
          GITHUB_TOKEN: ${{ github.token }}

  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([0-9]+).*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not detect active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_DIR" ]; then
            echo "Preinstalled Android SDK not found; installing command-line tools..."
            SDK_DIR="${RUNNER_TEMP}/android-sdk"
            mkdir -p "${SDK_DIR}/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "${RUNNER_TEMP}/cmdline-tools.zip"
            unzip -q "${RUNNER_TEMP}/cmdline-tools.zip" -d "${SDK_DIR}/cmdline-tools"
            mv "${SDK_DIR}/cmdline-tools/cmdline-tools" "${SDK_DIR}/cmdline-tools/latest"
          fi

          sudo chmod -R a+rwX "$SDK_DIR" || true

          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "Configured Android SDK at: ${SDK_DIR}"

          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          else
            mkdir -p "${SDK_DIR}/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${SDK_DIR}/licenses/android-sdk-license"
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web App and Generate Android Project
        env:
          SKP_UPDATE_READ_TOKEN: ${{ secrets.SKP_UPDATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/aistudio || true
          npm install --legacy-peer-deps
          VITE_NATIVE_ANDROID="true" \
          VITE_GITHUB_REPO="${GITHUB_REPOSITORY}" \
          VITE_APP_BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
          VITE_APP_COMMIT_SHA="${GITHUB_SHA:0:7}" \
          npm run build

          cat > dist/sw.js << 'EOF'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys()
                .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
                .then(() => self.registration.unregister())
            );
          });
          EOF

          OTA_REL_DIR="${RUNNER_TEMP}/skp-vpn-ota-release"
          rm -rf "$OTA_REL_DIR"
          mkdir -p "$OTA_REL_DIR"
          (
            cd dist
            zip -qr "${OTA_REL_DIR}/ota-bundle.zip" .
          )
          node -e '
            const fs = require("fs");
            const manifest = {
              repo: process.env.GITHUB_REPOSITORY || "",
              runNumber: parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10) || 1,
              commit: (process.env.GITHUB_SHA || "").slice(0, 7),
              fullCommit: process.env.GITHUB_SHA || "",
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync(process.argv[1], JSON.stringify(manifest, null, 2));
          ' "${OTA_REL_DIR}/ota-manifest.json"

          npm install --save-dev --legacy-peer-deps \
            @capacitor/core@6.2.0 \
            @capacitor/cli@6.2.0 \
            @capacitor/android@6.2.0

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

          # Inject real Android WireGuard VpnService bridge, manifest, and SKP VPN launcher icons
          cp android-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp android/app/src/main/res/mipmap-*/ic_launcher*.png || true
          cp -r android-native/res/* android/app/src/main/res/
          find android/app/src/main/java -name "MainActivity.java" -delete || true
          mkdir -p android/app/src/main/java/com/skpvpn/android
          cp android-native/java/com/skpvpn/android/MainActivity.java android/app/src/main/java/com/skpvpn/android/MainActivity.java
          cp android-native/java/com/skpvpn/android/SkpVpnBridge.java android/app/src/main/java/com/skpvpn/android/SkpVpnBridge.java

          # Inject exact GITHUB_REPOSITORY (and optional read token) + minSdkVersion >= 24 + versionCode + WireGuard AAR
          node -e '
            const fs = require("fs");
            const runNum = parseInt(process.env.GITHUB_RUN_NUMBER || "1", 10) || 1;
            const repoSlug = (process.env.GITHUB_REPOSITORY || "shahidpitafiskp-ui/Skp-vpn").trim();
            const readToken = (process.env.SKP_UPDATE_READ_TOKEN || "").trim();

            const bridgePath = "android/app/src/main/java/com/skpvpn/android/SkpVpnBridge.java";
            let bridgeSrc = fs.readFileSync(bridgePath, "utf8");
            bridgeSrc = bridgeSrc.replace(
              /private static final String DEFAULT_GITHUB_REPO = "[^"]*";/,
              `private static final String DEFAULT_GITHUB_REPO = ${JSON.stringify(repoSlug)};`
            );
            bridgeSrc = bridgeSrc.replace(
              /private static final String BUILD_READ_TOKEN = "[^"]*";/,
              `private static final String BUILD_READ_TOKEN = ${JSON.stringify(readToken)};`
            );
            fs.writeFileSync(bridgePath, bridgeSrc);

            const varsPath = "android/variables.gradle";
            let vars = fs.readFileSync(varsPath, "utf8");
            vars = vars.replace(/minSdkVersion\s*=\s*\d+/, "minSdkVersion = 24");
            fs.writeFileSync(varsPath, vars);

            const appGradlePath = "android/app/build.gradle";
            let appGradle = fs.readFileSync(appGradlePath, "utf8");
            appGradle = appGradle.replace(/versionCode\s+\d+/, "versionCode " + runNum);
            appGradle = appGradle.replace(/versionName\s+"[^"]*"/, `versionName "1.${runNum}.0"`);
            if (!appGradle.includes("com.wireguard.android:tunnel")) {
              appGradle += `\n// SKP_NATIVE_WIREGUARD_VPN\nandroid {\n    signingConfigs {\n        debug {\n            storeFile rootProject.file("../debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n        coreLibraryDesugaringEnabled true\n    }\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging true\n        }\n    }\n}\n\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n    implementation "com.wireguard.android:tunnel:1.0.20260102"\n}\n`;
            }
            fs.writeFileSync(appGradlePath, appGradle);
          '

          printf "sdk.dir=%s\n" "${ANDROID_HOME}" > android/local.properties

      - name: Prepare persistent APK signing keystore
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./debug.keystore ./debug.p12
          if [ -f "android-native/signing/debug-cert.pem" ] && [ -f "android-native/signing/debug-key.pem" ]; then
            openssl pkcs12 -export \
              -in android-native/signing/debug-cert.pem \
              -inkey android-native/signing/debug-key.pem \
              -out ./debug.p12 \
              -name androiddebugkey \
              -passout pass:android
            "${JAVA_HOME}/bin/keytool" -importkeystore \
              -srckeystore ./debug.p12 \
              -srcstoretype PKCS12 \
              -srcstorepass android \
              -destkeystore ./debug.keystore \
              -deststorepass android \
              -destkeypass android \
              -noprompt >/dev/null 2>&1
            rm -f ./debug.p12
          else
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi

          mkdir -p "${HOME}/.android"
          cp ./debug.keystore "${HOME}/.android/debug.keystore"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (
            cd android
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          )
          mkdir -p app/build/outputs/apk/debug
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "android/app/build/outputs/apk/debug/app-debug.apk" "app/build/outputs/apk/debug/app-debug.apk"
          fi

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK"
            if [ -d "android/app/build/outputs/apk" ]; then
              echo "Discovered APKs inside android/app/build/outputs/apk:"
              find android/app/build/outputs/apk -type f -name "*.apk" || true
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK file at $EXPECTED_APK is empty."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: File does not have .apk extension: $EXPECTED_APK"
              exit 1
              ;;
          esac

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${RUNNER_TEMP}/skp-vpn-release-asset"
          OTA_REL_DIR="${RUNNER_TEMP}/skp-vpn-ota-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_DIR}/app-debug.apk"
          if [ -f "${OTA_REL_DIR}/ota-manifest.json" ]; then
            cp "${OTA_REL_DIR}/ota-manifest.json" "${RELEASE_DIR}/ota-manifest.json"
          fi
          if [ -f "${OTA_REL_DIR}/ota-bundle.zip" ]; then
            cp "${OTA_REL_DIR}/ota-bundle.zip" "${RELEASE_DIR}/ota-bundle.zip"
          fi

          if [ ! -s "${RELEASE_DIR}/app-debug.apk" ]; then
            echo "ERROR: Prepared release asset is missing or empty."
            exit 1
          fi

          echo "apk_path=${RELEASE_DIR}/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_dir=${RELEASE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          APK_PATH="${{ steps.prepare_asset.outputs.apk_path }}"
          RELEASE_DIR="${{ steps.prepare_asset.outputs.release_dir }}"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Prepared APK does not exist or is empty: $APK_PATH"
            exit 1
          fi

          ASSETS=("$APK_PATH")
          if [ -f "${RELEASE_DIR}/ota-manifest.json" ]; then
            ASSETS+=("${RELEASE_DIR}/ota-manifest.json")
          fi
          if [ -f "${RELEASE_DIR}/ota-bundle.zip" ]; then
            ASSETS+=("${RELEASE_DIR}/ota-bundle.zip")
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          Automatically generated debug APK and Instant OTA bundle for SKP VPN built by GitHub Actions.

          - Workflow Run Number: ${GITHUB_RUN_NUMBER}
          - Workflow Run Attempt: ${GITHUB_RUN_ATTEMPT}
          - Source Commit SHA: ${GITHUB_SHA}
          - Signing: Persistent SKP VPN signing certificate (seamless in-place updates).
          EOF
          )

          if gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --latest
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          IS_PRIVATE=$(gh api "repos/${GITHUB_REPOSITORY}" -q .private 2>/dev/null || echo "unknown")

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_PAGE_URL=$(gh release view "$RELEASE_TAG" --repo "${GITHUB_REPOSITORY}" --json url -q .url)
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release Page: $RELEASE_PAGE_URL"
            echo "APK Filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"

            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **APK Asset:** \`app-debug.apk\`"
              if [ "$IS_PRIVATE" = "true" ]; then
                echo "- **⚠️ IMPORTANT FOR IN-APP AUTO-UPDATE:** Your repository \`${GITHUB_REPOSITORY}\` is currently **Private**. GitHub returns HTTP 404 to unauthenticated phone updates on Private repos. Go to **Settings → Change repository visibility → Public** so SKP VPN can auto-update in 1 tap!"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Publishing to GitHub Releases did not succeed."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded, and the backup Actions artifact 'app-debug-apk' remains available."
            fi
          fi
